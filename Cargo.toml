[package]
name = "cord-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Andrey Vityuk"]
description = "Fast Rust library providing a rope-like byte sequence with cheap cloning, slicing, appending, prepending, and zero-copy buffer adoption"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/avityuk/cord-rs"
documentation = "https://docs.rs/cord-rs"
keywords = ["cord", "rope", "bytes", "no_std"]
categories = ["data-structures", "memory-management", "no-std"]
# Explicit allowlist (cleaner than exclude here): ships the crate itself,
# its tests/benches, and the scripts CONTRIBUTING.md documents in detail;
# excludes dev-only files (CLAUDE.md, rustfmt.toml) and CI config (.github).
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "scripts/*.sh",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
]

[features]
default = ["std"]
# `std::io` integration (`Read`/`BufRead`/`Seek` on `Cursor`, `Write` on
# `Cord`, `CordBuffer` and `CordWriter`), plus each optional dependency's own
# `std` feature. Without it the crate is `no_std` and needs only `alloc` (a
# global allocator).
std = ["memchr/std", "bytes?/std", "serde?/std"]
# `bytes::Buf` for `Cord` and `Cursor`, `bytes::BufMut` for `CordWriter` and
# `CordBuffer`, and zero-copy conversions between `Cord` and `bytes::Bytes`.
bytes = ["dep:bytes"]
# `serde::Serialize` / `serde::Deserialize` for `Cord` (as a byte sequence).
serde = ["dep:serde"]

[dependencies]
memchr = { version = "2.7", default-features = false }
bytes = { version = "1.10.1", optional = true, default-features = false }
serde = { version = "1.0.100", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# proptest's RNG (getrandom) does not build on wasm32-unknown-unknown, which
# the check gate uses to compile-check the 32-bit layouts.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1.4"

[[bench]]
name = "cord"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.clippy]
# Strict: the whole pedantic group is enabled; CI runs clippy with -D warnings.
pedantic = { level = "warn", priority = -1 }
