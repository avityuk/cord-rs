name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test --all-features --release --test model
        env:
          PROPTEST_CASES: 2000

  lint:
    name: fmt, clippy, docs, msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `-D warnings` is scoped to these clippy invocations (which lint our
      # own code) rather than set workflow-wide: a blanket `RUSTFLAGS: -D
      # warnings` also applies to dependency compilation, and in the other
      # jobs here (test/cross/miri/sanitizers) dependencies dominate the
      # build — a new warning from a third-party crate under a newer
      # toolchain would then fail every job, not just this lint gate.
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo publish --dry-run --locked
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo check --all-features --locked
      - run: cargo check --no-default-features --locked
      - run: cargo check --no-default-features --features bytes,serde --locked
      # `[package.metadata.docs.rs]` passes `--cfg docsrs` (enabling the
      # nightly-only `doc_cfg` feature); the plain `cargo doc` step above runs
      # on stable and so can't reproduce a docs.rs-only failure. Nightly here
      # is for this check only -- it doesn't change what the crate needs to
      # build or be used.
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # `--no-dev-deps` on the check leg: `serde` is both an optional feature
      # and a dev-dependency here, so a plain powerset check could pass with
      # lib code that only compiles because the dev-dependency happens to be
      # present. clippy/doc pull in dev-deps as usual (they need the test
      # targets), matching how `lint` and `scripts/check.sh` already run
      # those.
      - run: cargo hack --feature-powerset --no-dev-deps check
      # See the `lint` job above for why `-D warnings` is scoped to these
      # invocations rather than set workflow-wide.
      - run: cargo hack --feature-powerset clippy --all-targets -- -D warnings
      - run: cargo hack --feature-powerset doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cross:
    name: 32-bit and big-endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu, powerpc64-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: test on 32-bit
        run: cargo test --all-features --target i686-unknown-linux-gnu
      - name: clippy on 32-bit
        run: cargo clippy --all-features --all-targets --target i686-unknown-linux-gnu -- -D warnings
      - name: build for big-endian
        run: cargo build --all-features --target powerpc64-unknown-linux-gnu
      - name: build for wasm32
        run: cargo build --all-features --target wasm32-unknown-unknown

  no_std:
    name: no_std (aarch64-unknown-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      # See the `lint` job above for why `-D warnings` is scoped to these
      # invocations rather than set workflow-wide. `cargo check` has no
      # trailing `-- <rustc args>` (unlike clippy below), so it goes through
      # RUSTFLAGS here instead.
      - run: cargo check --lib --no-default-features --target aarch64-unknown-none
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check --lib --no-default-features --features bytes --target aarch64-unknown-none
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check --lib --no-default-features --features serde --target aarch64-unknown-none
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check --lib --no-default-features --features bytes,serde --target aarch64-unknown-none
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --lib --no-default-features --features bytes,serde --target aarch64-unknown-none -- -D warnings
      # `cargo check --lib` above never links, so it proves nothing about an
      # allocator or a panic handler, and never monomorphizes generic code
      # nothing instantiates. ci/no_std_bin is a standalone crate (its own
      # `[workspace]`) that links a real `#![no_std] #![no_main]` binary
      # against a bump allocator and exercises the public API -- see its
      # Cargo.toml and CONTRIBUTING.md.
      - run: cargo build --manifest-path ci/no_std_bin/Cargo.toml --target aarch64-unknown-none
      - run: cargo build --manifest-path ci/no_std_bin/Cargo.toml --target aarch64-unknown-none --release
      - run: cargo build --manifest-path ci/no_std_bin/Cargo.toml --features bytes,serde --target aarch64-unknown-none
      - run: cargo build --manifest-path ci/no_std_bin/Cargo.toml --features bytes,serde --target aarch64-unknown-none --release

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/miri.sh
      # src/buffer.rs's cfg(target_endian) layout is the crate's only one and
      # is otherwise never executed (the `cross` job only builds powerpc64);
      # Miri can interpret a foreign target without that target's toolchain
      # component installed, so run the lib and public-API legs for real on a
      # big-endian target. Not part of scripts/miri.sh's required set (see
      # its MIRI_TARGET option) since it would double every local pre-push
      # run; cheap enough to always run in CI.
      #
      # `criterion` (a dev-dependency, only used by benches/cord.rs) pulls in
      # `alloca`, which has a real C source file and so needs an actual
      # s390x cross compiler at build time even though nothing here ever
      # runs benches -- `cargo test`/`miri test` build the package's whole
      # dev-dependency graph regardless of which target (`--lib`, in this
      # case) is requested. Same idea as `gcc-multilib` in the `cross` job
      # above, for a different architecture.
      - run: sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu
      - name: miri (s390x-unknown-linux-gnu, big-endian)
        run: |
          cargo +nightly miri test --all-features --lib --target s390x-unknown-linux-gnu
          cargo +nightly miri test --all-features --test basic --target s390x-unknown-linux-gnu
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    # ASan/TSan both rebuild std from source (-Zbuild-std) plus the whole
    # test suite twice; generous but bounded so a genuine hang/regression
    # fails fast instead of riding out the default 6-hour cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/sanitize.sh
        env:
          PROPTEST_CASES: 64
